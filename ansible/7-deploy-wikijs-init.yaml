---
# ============================================================
# Playbook : Deploy Wiki.js (Init phase)
# Fichier  : 7-deploy-wikijs-init.yaml
#
# Objectifs :
# - Clone le repo
# - Installe Helm 3 si manquant
# - Ajoute/met à jour le chart repo requarks
# - Déploie/upgrade la release "wikijs" dans le namespace "wikijs"
#   avec replicaCount=1 (phase init — setup wizard uniquement)
# - STOP ici : scaling/HPA géré par le playbook 8
#
# FIXES v2 :
#   - Validation explicite de l'ingress : fail si aucun ingress
#     trouvé dans le namespace wikijs (évite que le playbook
#     réussisse silencieusement sans ingress, ce qui rendrait
#     kubectl get ingress -n wikijs vide sans alarme)
#   - rollout wait avec failed_when: true (le best-effort cachait
#     les erreurs de démarrage réelles)
# ============================================================

- name: Deploy Wiki.js (Init phase) using repo values file
  hosts: k8s_master
  become: true
  gather_facts: true

  vars:
    repo_url: "https://github.com/egoMasa/DevOps-JFKZ.git"
    repo_version: "main"
    repo_dest: "/opt/devops-jfkz"

    wikijs_values_file: "{{ repo_dest }}/k8s/02-wikijs/values-wikijs.yaml"

    wikijs_namespace: "wikijs"
    wikijs_release: "wikijs"
    wikijs_chart: "requarks/wiki"

    helm_bin: "/usr/local/bin/helm"
    kubeconfig_path: "/home/ansible/.kube/config"

  tasks:
    # ------------------------------------------------------------------------
    # 0) Prérequis OS
    # ------------------------------------------------------------------------
    - name: Install required packages (git, curl)
      ansible.builtin.apt:
        name:
          - git
          - curl
        state: present
        update_cache: true

    # ------------------------------------------------------------------------
    # 1) Clone / update repo
    # ------------------------------------------------------------------------
    - name: Clone project repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_version }}"
        update: true

    - name: Ensure values file exists in repo
      ansible.builtin.stat:
        path: "{{ wikijs_values_file }}"
      register: values_stat

    - name: Fail if values file is missing
      ansible.builtin.fail:
        msg: "Missing values file: {{ wikijs_values_file }} (expected: k8s/02-wikijs/values-wikijs.yaml in the repo)"
      when: not values_stat.stat.exists

    # ------------------------------------------------------------------------
    # 2) Helm 3
    # ------------------------------------------------------------------------
    - name: Install Helm 3 (only if not already installed)
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash
        creates: "{{ helm_bin }}"

    - name: Show Helm version
      ansible.builtin.command: "{{ helm_bin }} version"
      register: helm_version
      changed_when: false

    # ------------------------------------------------------------------------
    # 3) Helm repo
    # ------------------------------------------------------------------------
    - name: Add requarks Helm repo (idempotent)
      ansible.builtin.command: "{{ helm_bin }} repo add requarks https://charts.js.wiki"
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when: false

    - name: Helm repo update
      ansible.builtin.command: "{{ helm_bin }} repo update"
      changed_when: false

    # ------------------------------------------------------------------------
    # 4) Namespace
    # ------------------------------------------------------------------------
    - name: Ensure namespace exists
      ansible.builtin.command: "kubectl get ns {{ wikijs_namespace }}"
      register: ns_check
      failed_when: false
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Create namespace if missing
      ansible.builtin.command: "kubectl create namespace {{ wikijs_namespace }}"
      when: ns_check.rc != 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ------------------------------------------------------------------------
    # 5) Deploy via Helm (install ou upgrade)
    # ------------------------------------------------------------------------
    - name: Check if Wiki.js release already exists
      ansible.builtin.command: "{{ helm_bin }} -n {{ wikijs_namespace }} list -q"
      register: helm_list
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Install Wiki.js (INIT — replicaCount=1 attendu dans values)
      ansible.builtin.command: >
        {{ helm_bin }} install {{ wikijs_release }} {{ wikijs_chart }}
        -n {{ wikijs_namespace }}
        -f {{ wikijs_values_file }}
      when: wikijs_release not in helm_list.stdout_lines
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Upgrade Wiki.js si release déjà existante
      ansible.builtin.command: >
        {{ helm_bin }} upgrade {{ wikijs_release }} {{ wikijs_chart }}
        -n {{ wikijs_namespace }}
        -f {{ wikijs_values_file }}
      when: wikijs_release in helm_list.stdout_lines
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ------------------------------------------------------------------------
    # 6) Rollout + checks
    # ------------------------------------------------------------------------
    # FIX: failed_when retiré (était à false, masquait les erreurs réelles).
    # En phase init on veut savoir si le pod démarre vraiment.
    - name: Wait for deployment rollout
      ansible.builtin.command: "kubectl -n {{ wikijs_namespace }} rollout status deploy/{{ wikijs_release }} --timeout=300s"
      register: rollout
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Show pods
      ansible.builtin.command: "kubectl -n {{ wikijs_namespace }} get pods -o wide"
      register: pods_out
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Get ingress
      ansible.builtin.command: "kubectl -n {{ wikijs_namespace }} get ingress -o wide"
      register: ingress_out
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # FIX: validation explicite de l'ingress.
    # L'ancienne tâche avait failed_when: false — si l'ingress était absent
    # (ingress.enabled: false dans values), le playbook réussissait sans
    # avertissement et kubectl get ingress -n wikijs retournait vide.
    - name: Fail if no ingress found in namespace wikijs
      ansible.builtin.fail:
        msg: >
          Aucun ingress trouvé dans le namespace '{{ wikijs_namespace }}'.
          Vérifie que ingress.enabled est bien à true dans values-wikijs.yaml
          et que le hostname est défini (ingress.hosts).
      when: >
        ingress_out.rc != 0
        or ingress_out.stdout | trim == ''
        or 'No resources found' in ingress_out.stdout

    - name: Show logs (tail) — best effort
      ansible.builtin.command: "kubectl -n {{ wikijs_namespace }} logs deploy/{{ wikijs_release }} --tail=120"
      register: logs_out
      failed_when: false
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ------------------------------------------------------------------------
    # 7) Résumé + prochaine étape manuelle
    # ------------------------------------------------------------------------
    - name: Print summary / next manual step
      ansible.builtin.debug:
        msg:
          - "Helm: {{ helm_version.stdout }}"
          - "Repo cloned to: {{ repo_dest }}"
          - "Values file used: {{ wikijs_values_file }}"
          - "Rollout status: {{ rollout.stdout }}"
          - "Pods:\n{{ pods_out.stdout }}"
          - "Ingress:\n{{ ingress_out.stdout }}"
          - "Logs (tail):\n{{ logs_out.stdout | default('no logs yet') }}"
          - "NEXT: Ajouter wikijs.lab -> {{ ingress_out.stdout | regex_search('\\d+\\.\\d+\\.\\d+\\.\\d+') | default('<EXTERNAL-IP>') }} dans /etc/hosts."
          - "Ouvrir http://wikijs.lab/ et compléter le setup wizard (admin + Site URL)."
          - "STOP — scaling/HPA géré par le playbook 8."